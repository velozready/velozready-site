<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Email Confirmed | VelozReady</title>
<script>
  // The confirmation link adds sign-in tokens to this address. This page never uses them:
  // remove them from the address bar and browser history right away.
  if (location.hash || location.search) history.replaceState(null, "", location.pathname);
</script>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:#080d12;color:#e9f0f6;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  main{width:100%;max-width:440px;background:#0d1720;border:1px solid #2a3b49;border-radius:22px;padding:28px 24px;text-align:center}
  .brand{font-weight:900;letter-spacing:-.5px;font-size:22px;margin-bottom:18px}.brand span{color:#ff3a4f}
  .check{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:#11331f;color:#3ddc84;font-size:34px;font-weight:900}
  h1{margin:0 0 10px;font-size:26px;line-height:1.2}
  p{margin:0 0 14px;color:#b9c7d4}
  ol{text-align:left;margin:0 0 18px;padding-left:22px;color:#c9d5e0}
  a.button{display:block;padding:15px;border-radius:14px;background:linear-gradient(180deg,#ff3049,#e90032);color:#fff;font-weight:900;text-decoration:none}
  small{display:block;margin-top:14px;color:#7f91a1}
  .iphone-only{display:none}
  .is-iphone .iphone-only{display:block}
</style>
</head>
<body>
<main>
  <div class="brand">Veloz<span>Ready</span></div>
  <div class="check" aria-hidden="true">✓</div>
  <h1>Your email is confirmed</h1>
  <p>Go back to the VelozReady app on your iPhone to finish signing in.</p>
  <ol>
    <li>Open VelozReady on your iPhone.</li>
    <li>Tap <strong>I confirmed my email — Sign In</strong>.</li>
  </ol>
  <a class="button iphone-only" href="velozready://auth/confirmed">Open VelozReady</a>
  <small>You can close this page.</small>
</main>
<script>
  if (/iPhone|iPad|iPod/.test(navigator.userAgent)) document.body.classList.add("is-iphone");
</script>
</body>
</html>
