<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>VelozReady</title>
<meta name="description" content="VelozReady is a training and readiness app for runners and their teams. Coming soon to iPhone.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
  *{box-sizing:border-box}
  :root{--bg:#080d12;--card:#0d1720;--line:#2a3b49;--text:#e9f0f6;--muted:#9fb0bf;--accent:#ff3a4f}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}
  .hero{width:100%;max-width:520px;text-align:center}
  .hero img{width:112px;height:112px;border-radius:26px;box-shadow:0 12px 40px rgba(255,58,79,.18)}
  .brand{margin:20px 0 6px;font-size:40px;font-weight:900;letter-spacing:-1px;line-height:1.05}
  .brand span{color:var(--accent)}
  .lead{margin:0 auto 22px;max-width:420px;color:var(--muted);font-size:18px}
  .soon{display:inline-block;padding:9px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:14px;font-weight:800;letter-spacing:.02em}
  .links{margin-top:32px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px;font-size:14px}
  a{color:#8fc3ff;text-decoration:none}
  a:hover{text-decoration:underline}
  footer{padding:20px 16px 28px;text-align:center;color:#71859a;font-size:12.5px;border-top:1px solid #15212b}
</style>
</head>
<body>
<main>
  <div class="hero">
    <img src="assets/logo.png" alt="VelozReady logo">
    <h1 class="brand">Veloz<span>Ready</span></h1>
    <p class="lead">Training and readiness for runners and their teams.</p>
    <span class="soon">Coming soon to iPhone</span>
    <nav class="links" aria-label="Site links">
      <a href="legal/">Legal notices</a>
      <a href="legal/privacy.html">Privacy Policy</a>
      <a href="legal/terms.html">Terms of Use</a>
      <a href="mailto:support@velozready.com">support@velozready.com</a>
    </nav>
  </div>
</main>
<footer>VelozReady is an app owned and operated by Sahar Ventures LLC.</footer>
</body>
</html>
